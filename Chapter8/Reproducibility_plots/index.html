<div id="content"></div>

<script>
const datasets = ["5s", "30s", "2min", "60min"];

const chromosomes = [
    ...Array.from({ length: 11 }, (_, i) => `Chr${i + 1}`),
    "ChrZ"
];

const content = document.getElementById("content");

datasets.forEach(dataset => {

    const section = document.createElement("section");

    section.innerHTML = `
        <h2>${dataset}</h2>
        <ul class="plots">
            ${chromosomes.map(chr => `
                <li>
                    <a href="${dataset}/${dataset}_reproducibility_10kb_${chr}.html">
                        ${chr.replace("Chr", "Chromosome ")}
                        <span class="chr">10 kb reproducibility plot</span>
                    </a>
                </li>
            `).join("")}
        </ul>
    `;

    content.appendChild(section);
});
</script>
